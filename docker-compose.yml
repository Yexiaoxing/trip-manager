services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trip_manager
      POSTGRES_USER: trip
      POSTGRES_PASSWORD: trip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip -d trip_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  web:
    build: .
    command: sh -c "pnpm prisma:deploy && pnpm start"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trip:trip@postgres:5432/trip_manager?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:12312"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - app_storage:/app/storage

  worker:
    build: .
    command: sh -c "pnpm prisma:deploy && pnpm worker"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trip:trip@postgres:5432/trip_manager?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'tsx src/worker/index.ts' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - app_storage:/app/storage

volumes:
  postgres_data:
  redis_data:
  app_storage:
